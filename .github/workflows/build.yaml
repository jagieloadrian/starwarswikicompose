name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Restore props
      - name: Restore secret files
        run: |
          mkdir -p app
          echo "${{ secrets.RELEASE_KEYSTORE_JKS }}" | base64 --decode > release-keystore.jks
          echo "${{ secrets.RELEASE_KEYSTORE_PROPERTIES }}"  > release-keystore.properties
          echo "${{ secrets.PASSWORDS_PROPERTIES }}"  > passwords.properties
          echo "${{ secrets.SERVICE_ACCOUNT_JSON }}"  > service-account.json
          FLICKR_KEY=$(grep -oP '(?<=flickrApiKey=").*?(?=")' passwords.properties || true)
          [ -n "$FLICKR_KEY" ] && echo "::add-mask::$FLICKR_KEY"; true

      # 4. Cache Gradle
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Build project
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 6. Unit tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Generate coverage report
        run: ./gradlew jacocoTestReport --no-daemon

      # 🔹 Upload coverage do Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          flags: unittests
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  instrumentedTest:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore secret files
        run: |
          mkdir -p app
          echo "${{ secrets.RELEASE_KEYSTORE_JKS }}" | base64 --decode > release-keystore.jks
          echo "${{ secrets.RELEASE_KEYSTORE_PROPERTIES }}"  > release-keystore.properties
          echo "${{ secrets.PASSWORDS_PROPERTIES }}"  > passwords.properties
          echo "${{ secrets.SERVICE_ACCOUNT_JSON }}"  > service-account.json
          FLICKR_KEY=$(grep -oP '(?<=flickrApiKey=").*?(?=")' passwords.properties || true)
          [ -n "$FLICKR_KEY" ] && echo "::add-mask::$FLICKR_KEY"; true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests (androidTest)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SW_COMPOSE_INSTRUMENTED_TEST_REPORT-${{ github.run_id }}
          path: app/build/reports/androidTests/connected/**
          retention-days: 30

      - name: Generate coverage report
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          flags: instrumentedtests
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}